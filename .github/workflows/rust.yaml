on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

name: Lint and Test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned, not floating `nightly`. rustfmt.toml turns on unstable options
      # (`wrap_comments` in particular), whose output changes between nightlies:
      # a rustfmt change between 2026-08-23 and 2026-09-02 started re-wrapping
      # comments at `comment_width` (80) instead of `max_width` (100), which
      # turned this job red without a single commit touching the code. Bump the
      # date deliberately and reformat in the same commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-03
          components: clippy, rustfmt
      - run: |
          cargo +nightly-2026-09-03 fmt --all -- --check
          # Check formatting for each example
          for manifest in $(find examples -name Cargo.toml); do
            cargo +nightly-2026-09-03 fmt --manifest-path "$manifest" -- --check
          done

      ## clippy is currently broken, require big refactor
      # - run: cargo clippy -- -D warnings

  test:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core Libs
            command: |
              cargo test -r --lib --no-fail-fast \
                -p tvm_abi \
                -p tvm_types \
                -p tvm_block_json \
                -p tvm_sdk \
                -p tvm_vm \
                --features tvm_vm/gosh,tvm_vm/signature_with_id

          - name: tvm_block / default
            command: |
              cargo test -r --tests --no-fail-fast \
                -p tvm_block

          - name: tvm_block / signature_with_id
            command: |
              cargo test -r --lib --no-fail-fast \
                -p tvm_block \
                --features tvm_block/signature_with_id

          - name: tvm_executor
            command: |
              cargo test -r --no-fail-fast \
                -p tvm_executor \
                --lib \
                --test node_executor_gosh \
                --features tvm_executor/gosh,tvm_executor/signature_with_id,tvm_executor/wasmtime
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ vars.SCCACHE_GHA_VERSION || 1 }}
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Setup cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}

  test-client:
    name: Test / tvm_client
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ vars.SCCACHE_GHA_VERSION || 1 }}
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Setup cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run tvm_client tests
        run: |
          cargo test -r --lib --no-fail-fast \
            -p tvm_client \
            --no-default-features \
            --features tvm_client/std,tvm_client/rustls-tls-webpki-roots

  test-cli:
    name: Test / tvm_cli
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ vars.SCCACHE_GHA_VERSION || 1 }}
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Setup cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Deliberately a debug build, unlike every other job here. Several of
      # these tests exist to catch clap's "argument not defined" assertion,
      # which is `#[cfg(debug_assertions)]`; `[profile.release]` does not turn
      # debug assertions back on, so under `-r` those tests would pass even
      # with the bug they guard reintroduced.
      - name: Run tvm_cli tests
        run: cargo test --no-fail-fast -p tvm_cli
